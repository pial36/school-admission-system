server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always fetch the latest runtime config (backend URL).
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Built JS/CSS have content hashes in their names -> safe to cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
